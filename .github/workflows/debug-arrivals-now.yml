name: Debug Carris arrivals now

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Dump current arrivals for both stops
        run: |
          curl -s --connect-timeout 10 --max-time 30 -w "\nHTTP_STATUS:%{http_code}\n" "https://api.carrismetropolitana.pt/v2/arrivals/by_stop/120060" -o debug-casa.json
          curl -s --connect-timeout 10 --max-time 30 -w "\nHTTP_STATUS:%{http_code}\n" "https://api.carrismetropolitana.pt/v2/arrivals/by_stop/060462" -o debug-trabalho.json
          curl -s --connect-timeout 10 --max-time 30 -o debug-vehicles.json "https://api.carrismetropolitana.pt/v2/vehicles"
          echo "=== casa (120060) ==="
          cat debug-casa.json
          echo
          echo "=== trabalho (060462) ==="
          cat debug-trabalho.json
          echo
          echo "=== vehicles count ==="
          python3 -c "import json; d=json.load(open('debug-vehicles.json')); print(len(d) if isinstance(d,list) else d)"

      - name: Commit debug files
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add debug-casa.json debug-trabalho.json debug-vehicles.json
          git commit -m "Debug: dump current arrivals" || echo "nothing to commit"
          git push

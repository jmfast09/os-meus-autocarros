name: Debug shape id encoded vs stripped

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Try both forms of shape_id against /shapes
        run: |
          date -u
          echo "--- stripped: /shapes/326 ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/shapes/326"
          echo "--- raw (url-encoded brackets): /shapes/%5BXS3H8%5D326 ---"
          curl -s -o /tmp/s2.json -w "HTTP %{http_code}\n" --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/shapes/%5BXS3H8%5D326"
          jq '{has_geojson: (.geojson != null), geom_type: .geojson.geometry.type}' /tmp/s2.json 2>&1 || cat /tmp/s2.json
          echo "--- raw (literal brackets, unencoded): /shapes/[XS3H8]326 ---"
          curl -s -o /tmp/s3.json -w "HTTP %{http_code}\n" -g --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/shapes/[XS3H8]326"
          jq '{has_geojson: (.geojson != null), geom_type: .geojson.geometry.type}' /tmp/s3.json 2>&1 || cat /tmp/s3.json

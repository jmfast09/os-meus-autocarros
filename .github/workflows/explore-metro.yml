name: Explore Metro Lisboa station data

on:
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Metro Lisboa's CA chain
        run: |
          curl -s "http://crt.sectigo.com/SectigoPublicServerAuthenticationCAOVR36.crt" -o /tmp/intermediate.der
          curl -s "http://crt.sectigo.com/SectigoPublicServerAuthenticationRootR46.p7c" -o /tmp/root.p7c
          openssl x509 -inform DER -in /tmp/intermediate.der -out /tmp/intermediate.pem
          openssl pkcs7 -inform DER -in /tmp/root.p7c -print_certs -out /tmp/root.pem
          cat /tmp/intermediate.pem /tmp/root.pem /etc/ssl/certs/ca-certificates.crt > /tmp/ca-bundle.pem

      - name: Get token
        env:
          KEY: ${{ secrets.METRO_CONSUMER_KEY }}
          SECRET: ${{ secrets.METRO_CONSUMER_SECRET }}
        run: |
          set -e
          TOKEN=$(curl -s --cacert /tmp/ca-bundle.pem -X POST "https://api.metrolisboa.pt:8243/token" -u "$KEY:$SECRET" -d "grant_type=client_credentials" | jq -r .access_token)
          echo "$TOKEN" > /tmp/token.txt

      - name: List all stations (raw)
        run: |
          BASE="https://api.metrolisboa.pt:8243/estadoServicoML/1.0.1"
          TOKEN=$(cat /tmp/token.txt)
          curl -s --cacert /tmp/ca-bundle.pem "$BASE/infoEstacao/todos" -H "Authorization: Bearer $TOKEN" -o /tmp/estacoes.json
          echo "=== raw shape ==="
          head -c 500 /tmp/estacoes.json
          echo ""
          echo "=== stations matching Sebastiao / Oriente / Saldanha ==="
          jq -c '.. | objects | select((.. | strings | ascii_downcase) as $s | ["ebasti","riente","aldanha"] | any($s | test(.)))' /tmp/estacoes.json || true

      - name: Sample tempoEspera call for a guessed code
        run: |
          BASE="https://api.metrolisboa.pt:8243/estadoServicoML/1.0.1"
          TOKEN=$(cat /tmp/token.txt)
          for CODE in SS OR SA SS_AZ; do
            echo "--- code: $CODE ---"
            curl -s --cacert /tmp/ca-bundle.pem "$BASE/tempoEspera/Estacao/$CODE" -H "Authorization: Bearer $TOKEN"
            echo ""
          done

name: Debug station lookup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Metro Lisboa's CA chain
        run: |
          curl -s --connect-timeout 10 --max-time 30 "http://crt.sectigo.com/SectigoPublicServerAuthenticationCAOVR36.crt" -o /tmp/intermediate.der
          curl -s --connect-timeout 10 --max-time 30 "http://crt.sectigo.com/SectigoPublicServerAuthenticationRootR46.p7c" -o /tmp/root.p7c
          openssl x509 -inform DER -in /tmp/intermediate.der -out /tmp/intermediate.pem
          openssl pkcs7 -inform DER -in /tmp/root.p7c -print_certs -out /tmp/root.pem
          cat /tmp/intermediate.pem /tmp/root.pem /etc/ssl/certs/ca-certificates.crt > /tmp/ca-bundle.pem

      - name: Dump station data
        run: |
          TOKEN=$(python3 -c "import json; print(json.load(open('metro-auth.json'))['access_token'])")
          curl -s --connect-timeout 10 --max-time 30 --cacert /tmp/ca-bundle.pem "https://api.metrolisboa.pt:8243/estadoServicoML/1.0.1/tempoEspera/Estacao/SS" -H "Authorization: Bearer $TOKEN" -o debug-ss.json
          cat debug-ss.json

      - name: Commit debug file
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add debug-ss.json
          git commit -m "Debug: dump SS station data" || echo "nothing to commit"
          git push

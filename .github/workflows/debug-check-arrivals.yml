name: debug-check-arrivals

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch arrivals for stop 060462 and dump line_id/headsign/pattern_id
        run: |
          set -e
          curl -s --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/arrivals/by_stop/060462" -o /tmp/arr.json
          echo "--- raw count ---"
          jq 'length' /tmp/arr.json
          echo "--- fields of interest ---"
          jq '[.[] | {line_id, headsign, trip_id, pattern_id, direction_id, estimated_arrival, scheduled_arrival}]' /tmp/arr.json

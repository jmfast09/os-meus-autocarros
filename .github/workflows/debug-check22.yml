name: Debug vehicle GPS update frequency

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Poll /vehicles repeatedly and track timestamp changes for a handful of vehicles
        run: |
          date -u
          # Pick 5 arbitrary vehicle ids from the first poll, then track just
          # those across every subsequent poll (whatever line they're on —
          # 1724 isn't running right now, late evening).
          curl -s --connect-timeout 10 --max-time 15 "https://api.carrismetropolitana.pt/v2/vehicles" -o /tmp/veh_0.json
          echo "total vehicles active right now: $(jq 'length' /tmp/veh_0.json)"
          jq -r '[.[] | .id] | .[0:5] | .[]' /tmp/veh_0.json > /tmp/tracked_ids.txt
          cat /tmp/tracked_ids.txt

          for i in $(seq 1 15); do
            curl -s --connect-timeout 10 --max-time 15 "https://api.carrismetropolitana.pt/v2/vehicles" -o /tmp/veh_$i.json
            echo "--- poll $i at $(date -u +%H:%M:%S) ---"
            jq --slurpfile ids <(jq -R -s -c 'split("\n") | map(select(length>0))' /tmp/tracked_ids.txt) '
              ($ids[0]) as $wanted |
              [.[] | select(.id as $x | $wanted | index($x))] | map({id, timestamp, lat, lon, speed, current_status})
            ' /tmp/veh_$i.json
            sleep 4
          done

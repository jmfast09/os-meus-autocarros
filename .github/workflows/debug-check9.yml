name: Debug 1103 vehicle position

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check 1103 arrivals + vehicle match
        run: |
          date -u
          echo "--- arrivals stop 120060, line 1103 ---"
          curl -s --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/arrivals/by_stop/120060" \
            | jq '[.[] | select(.line_id == "1103")]'
          echo "--- arrivals stop 060462, line 1103 ---"
          curl -s --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/arrivals/by_stop/060462" \
            | jq '[.[] | select(.line_id == "1103")]'
          echo "--- vehicles line 1103 ---"
          curl -s --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/vehicles" \
            | jq '[.[] | select(.line_id == "1103")]'

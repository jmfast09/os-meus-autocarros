name: Debug deployed page content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch deployed index.html and check getShapeForPattern body
        run: |
          date -u
          curl -s -w "\nHTTP %{http_code}\n" --connect-timeout 10 --max-time 30 "https://jmfast09.github.io/os-meus-autocarros/index.html" -o /tmp/deployed.html
          cat /tmp/deployed.html | head -c 200
          echo
          echo "--- deployed getShapeForPattern ---"
          grep -n -A 14 "async function getShapeForPattern" /tmp/deployed.html
          echo "--- deployed onArrivalClick shape/vehicle section ---"
          grep -n -A 12 "Fetch the route shape and the vehicle position" /tmp/deployed.html
          echo "--- diff against repo's current index.html ---"
          diff /tmp/deployed.html index.html && echo "IDENTICAL" || echo "DIFFERS (see above)"

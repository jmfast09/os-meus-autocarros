name: Debug vehicles payload size

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Measure /vehicles response size
        run: |
          date -u
          curl -s -o /tmp/veh.json -w "HTTP %{http_code} in %{time_total}s, size %{size_download} bytes\n" --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/vehicles"
          jq 'length' /tmp/veh.json

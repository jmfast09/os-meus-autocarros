name: Debug shape line failure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check /patterns and /shapes for stop 060462 lines
        run: |
          date -u
          for PAT in 1724_0_1 1724_0_2 1724_1_1 1724_3_1 1103_0_1; do
            echo "=== /patterns/$PAT ==="
            curl -s -o /tmp/pat.json -w "HTTP %{http_code}\n" --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/patterns/$PAT"
            jq '.[0] | {id, shape_id}' /tmp/pat.json 2>&1 || cat /tmp/pat.json
            SHAPE_ID=$(jq -r '.[0].shape_id // empty' /tmp/pat.json | sed -E 's/^(\[[^]]*\])+//')
            echo "cleaned shape_id=$SHAPE_ID"
            if [ -n "$SHAPE_ID" ]; then
              echo "--- /shapes/$SHAPE_ID ---"
              curl -s -o /tmp/shape.json -w "HTTP %{http_code}\n" --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/shapes/$SHAPE_ID"
              jq '{has_geojson: (.geojson != null), geom_type: .geojson.geometry.type, coord_sample: (.geojson.geometry.coordinates | .[0])}' /tmp/shape.json 2>&1 || cat /tmp/shape.json
            fi
            echo
          done

name: Debug Carris API lookup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Dump vehicles and route data
        run: |
          curl -s --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/vehicles" -o debug-vehicles.json
          curl -s --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/arrivals/by_stop/060462" -o debug-arrivals.json
          curl -s --connect-timeout 10 --max-time 30 "https://api.carrismetropolitana.pt/v2/patterns/1724_0_1" -o debug-pattern.json
          echo "--- vehicles (first 2000 chars) ---"
          head -c 2000 debug-vehicles.json
          echo
          echo "--- vehicle count ---"
          python3 -c "import json; d=json.load(open('debug-vehicles.json')); print(len(d) if isinstance(d, list) else d)"
          echo "--- arrivals (first 1500 chars) ---"
          head -c 1500 debug-arrivals.json
          echo
          echo "--- pattern (first 1500 chars) ---"
          head -c 1500 debug-pattern.json

      - name: Commit debug files
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add debug-vehicles.json debug-arrivals.json debug-pattern.json
          git commit -m "Debug: dump Carris API samples" || echo "nothing to commit"
          git push
